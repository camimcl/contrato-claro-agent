[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contratoclaro"
version = "0.1.0"
description = "Assistente educativo de análise contratual com RAG e Amazon Bedrock AgentCore"
requires-python = ">=3.12,<3.15"
dependencies = ["boto3[crt]>=1.42", "requests>=2.32", "pypdf>=6", "streamlit>=1.50"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]
eval = ["deepeval>=3.5"]

[project.scripts]
contratoclaro = "contratoclaro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
